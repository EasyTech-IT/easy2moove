
name: Deploy Website to IONOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: SFTP Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: SFTP-Client installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Dateien zu IONOS übertragen
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail

          test -n "$SFTP_HOST" || { echo "GitHub Secret FTP_SERVER fehlt."; exit 1; }
          test -n "$SFTP_USER" || { echo "GitHub Secret FTP_USERNAME fehlt."; exit 1; }
          test -n "$SFTP_PASSWORD" || { echo "GitHub Secret FTP_PASSWORD fehlt."; exit 1; }
          test -n "$SFTP_PORT" || { echo "GitHub Secret FTP_PORT fehlt."; exit 1; }

          lftp -u "$SFTP_USER","$SFTP_PASSWORD" \
            "sftp://$SFTP_HOST:$SFTP_PORT" \
            -e "set sftp:auto-confirm yes; mirror --reverse --verbose --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .vscode/ ./ /; bye"

      - name: Live-Deployment prüfen
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          verify_dir="$(mktemp -d)"
          trap 'rm -rf "$verify_dir"' EXIT

          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --output "$verify_dir/style.css" \
            "https://easy2moove.de/css/style.css?deploy=$DEPLOY_SHA" \
            || { echo "Die Hero-CSS ist auf der Live-Website nicht abrufbar."; exit 1; }
          grep -Fq '.hero:not(.hero--home):not(.leistungen-hero)' "$verify_dir/style.css" \
            || { echo "Die neue Hero-CSS ist nicht auf der Live-Website angekommen."; exit 1; }

          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --output "$verify_dir/main.js" \
            "https://easy2moove.de/js/main.js?deploy=$DEPLOY_SHA" \
            || { echo "Das JavaScript ist auf der Live-Website nicht abrufbar."; exit 1; }
          grep -Fq 'privacy_notice_dismissed' "$verify_dir/main.js" \
            || { echo "Das neue JavaScript ist nicht auf der Live-Website angekommen."; exit 1; }

          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            --output /dev/null \
            "https://easy2moove.de/img/video.mp4?deploy=$DEPLOY_SHA"
