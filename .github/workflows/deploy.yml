
name: Deploy Website to IONOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: SFTP Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: SFTP-Client installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: IONOS-Webordner ermitteln
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail

          lftp -u "$SFTP_USER","$SFTP_PASSWORD" \
            "sftp://$SFTP_HOST:$SFTP_PORT" \
            -e "set sftp:auto-confirm yes; pwd; cls -la /; cls -la .; cls -la /public; cls -la /htdocs; cls -la /public_html; bye"

      - name: Dateien zu IONOS übertragen
        env:
          SFTP_HOST: ${{ secrets.FTP_SERVER }}
          SFTP_USER: ${{ secrets.FTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.FTP_PORT }}
        run: |
          set -euo pipefail

          test -n "$SFTP_HOST" || { echo "GitHub Secret FTP_SERVER fehlt."; exit 1; }
          test -n "$SFTP_USER" || { echo "GitHub Secret FTP_USERNAME fehlt."; exit 1; }
          test -n "$SFTP_PASSWORD" || { echo "GitHub Secret FTP_PASSWORD fehlt."; exit 1; }
          test -n "$SFTP_PORT" || { echo "GitHub Secret FTP_PORT fehlt."; exit 1; }

          lftp -u "$SFTP_USER","$SFTP_PASSWORD" \
            "sftp://$SFTP_HOST:$SFTP_PORT" \
            -e "set sftp:auto-confirm yes; mirror --reverse --verbose --exclude-glob .git/ --exclude-glob .github/ --exclude-glob .vscode/ ./ /public/; bye"
